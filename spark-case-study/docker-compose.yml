version: '3.8'

services:
  spark-master:
    build: .
    container_name: spark-master
    # Added security bypass flags to stop 403 errors and WebSocket connection failures
    command: >
      /bin/bash -c "/opt/spark/sbin/start-master.sh && 
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root 
      --ServerApp.token='' --ServerApp.password='' 
      --ServerApp.allow_origin='*' --ServerApp.disable_check_xsrf=True"
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077" # Spark Master Internal Port
      - "8888:8888" # Jupyter Lab
      - "4040:4040" # Spark Job UI (Captured for your report)
    volumes:
      - .:/app
      - ./retail_data:/data
    environment:
      - SPARK_LOCAL_IP=spark-master

  spark-worker-1:
    build: .
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081" # Spark Worker Web UI
    volumes:
      - .:/app
      - ./retail_data:/data
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G

  # Tip: For your 'Scalability Tests'[cite: 37], uncomment this second worker later
  spark-worker-2:
    build: .
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8081" # Spark Worker Web UI
    volumes:
      - .:/app
      - ./retail_data:/data
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - .:/app
      - ./retail_data:/data